[package]
name = "effectcraft-ofx"
description = "OpenFX (OFX 1.4) image-effect host: loads native OFX plug-in bundles and registers them as EffectCraft effects (plug-in API v2). Native code, no sandbox; opt-in through the hosts' `openfx` feature"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Deliberately NOT `[lints] workspace = true`: a plug-in host has to speak the C ABI and call
# into native code, which needs `unsafe` (the workspace forbids it). Every `unsafe` block lives in
# this crate and sits behind `catch_unwind` + null/magic checks (see `ffi.rs`); the crate keeps
# the workspace's other never-crash lints (see `lib.rs`).

[dependencies]
effectcraft-effects = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Native plug-in binaries only exist on native targets (on wasm32 the crate is empty).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { workspace = true }

[dev-dependencies]
effectcraft-effects = { workspace = true }
effectcraft-keyframe = { workspace = true }
effectcraft-project = { workspace = true }
serde_json = { workspace = true }

# Stopping helper programs plug-ins leave behind (`shutdown`), and the crash filter that records
# which plug-in action a crash happened in (`inflight`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
