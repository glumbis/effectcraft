[package]
name = "effectcraft-ofx"
description = "OpenFX (OFX 1.4) image-effect host: loads native OFX plug-in bundles and registers them as EffectCraft effects (plug-in API v2). Fork-only; native code, no sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Deliberately NOT `[lints] workspace = true`: a plug-in host has to speak the C ABI and call
# into native code, which needs `unsafe`. Every `unsafe` block lives in this crate and sits behind
# `catch_unwind` + null/magic checks (see `ffi.rs`).

[dependencies]
effectcraft-effects = { workspace = true }
libloading = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
effectcraft-effects = { workspace = true }
effectcraft-keyframe = { workspace = true }
effectcraft-project = { workspace = true }
serde_json = { workspace = true }
